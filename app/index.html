 function table(name){

  const snap=()=>{ const docs=[...t.rows.entries()].map(([id,d])=>({id,exists:true,data:()=>freeze(d)})); return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}; };

  t.merge=id=>{ const p=t.pub.get(id); if(!p){ t.rows.delete(id); return; } t.rows.set(id,{...p,...(t.fin.get(id)||{})}); };
  t.load=()=>{ if(!A.session){ t.rows.clear(); t.pub.clear(); t.fin.clear(); t.finOk=false; t.emit(); return Promise.resolve(); }
    if(!A.meReady) return Promise.resolve();
    if(!t.loaded){ const gen=t.gen=(t.gen||0)+1, adm=isAdmin();

        if(a.error) throw err(a.error); if(b.error) throw err(b.error); if(gen!==t.gen) return;
        t.finOk=adm;
        t.pub.clear(); t.fin.clear(); (a.data||[]).forEach(r=>t.pub.set(r.id,r.data||{})); (b.data||[]).forEach(r=>t.fin.set(r.id,r.data||{}));
        t.rows.clear(); t.pub.forEach((_,id)=>t.merge(id)); t.emit(); });
      else t.loaded=sb.from(name).select("id,data").then(({data,error})=>{ if(error) throw err(error); if(gen!==t.gen) return; t.rows.clear(); (data||[]).forEach(r=>t.rows.set(r.id,r.data)); t.emit(); });
      t.loaded.catch(()=>{ t.loaded=null; }); }
    return t.loaded; };
  t.listen=()=>{ if(t.chan||!A.session||!A.meReady) return; let ch=sb.channel("rt-"+name);
    const on=(tbl,fnc)=>{ ch=ch.on("postgres_changes",{event:"*",schema:"public",table:tbl},p=>{ const id=(p.new&&p.new.id)||(p.old&&p.old.id); if(!id) return; fnc(id,p.eventType==="DELETE"?null:(p.new&&p.new.data)||{}); t.emit(); }); };
    if(name==="sites"){ on("sites",(id,d)=>{ if(d) t.pub.set(id,d); else { t.pub.delete(id); t.fin.delete(id); } t.merge(id); });
      if(isAdmin()) on("site_fin",(id,d)=>{ if(d) t.fin.set(id,d); else t.fin.delete(id); t.merge(id); }); }
    else on(name,(id,d)=>{ if(d) t.rows.set(id,d); else t.rows.delete(id); });
    t.chan=ch.subscribe(); };
  t.reset=()=>{ if(t.chan){ sb.removeChannel(t.chan); t.chan=null; } t.loaded=null; t.gen=(t.gen||0)+1; t.finOk=false; t.rows.clear(); t.pub.clear(); t.fin.clear();
    if(t.subs.size||t.docSubs.size){ t.load().catch(()=>{}); t.listen(); } };
  t.snap=snap;
  return tables[name]=t;

function schedule(s){
  const c0=calcBase(s); let r=c0.received; const tot=c0.total;
  return (s.schedule||[]).map((m,i)=>{ const amt=Math.round(tot*n(m.pct)/100);
    const prog=m.trigger==="sign"?100:m.trigger==="progress"?Math.min(100,Math.round(c0.pct/Math.max(1,n(m.at))*100)):m.trigger==="handover"?(m.done?100:0):stagePct(s,m.trigger);
    const due=m.trigger==="sign"||(m.trigger==="progress"?c0.pct>=n(m.at):m.trigger==="handover"?!!m.done:stagePct(s,m.trigger)>=100);
    const paid=Math.max(0,Math.min(r,amt)); r-=paid;
    const st=paid>=amt&&amt>0?"paid":due?(paid>0?"partdue":"due"):(paid>0?"part":"wait");
    return {...m,i,amt,paid,left:amt-paid,due,prog,st}; });
}

function calc(s){
  const received = (s.payments||[]).reduce((a,p)=>a+n(p.amount),0);
  const spent = (s.purchases||[]).reduce((a,p)=>a+n(p.amount),0);

}

function compress(file, max=1600, type="image/jpeg"){
  return new Promise((res)=>{
    if(!file.type.startsWith("image/")) return res(file);
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); c.toBlob(b=>res(b||file),type,0.82); };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}
const isPdfFile=f=>!!f&&(f.type==="application/pdf"||/\.pdf$/i.test(f.name||""));
async function pdfPages(file, max=8){
  try{
    const lib=window.pdfjsLib; if(!lib) throw 0;
    const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise; const out=[];
    for(let i=1;i<=Math.min(doc.numPages,max);i++){
      const page=await doc.getPage(i); const v1=page.getViewport({scale:1}); const k=Math.min(3,1800/Math.max(v1.width,v1.height));
      const vp=page.getViewport({scale:k}); const c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
      const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); await page.render({canvasContext:ctx,viewport:vp}).promise;
      const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.88)); out.push(new File([b],`page${i}.jpg`,{type:"image/jpeg"}));
    }
    return out;
  }catch(e){ return [file]; }
}
async function pdfToImage(file){
  try{
    const lib=window.pdfjsLib; if(!lib) throw 0;
    const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const page=await doc.getPage(1); const v1=page.getViewport({scale:1}); const k=Math.min(4,2600/Math.max(v1.width,v1.height));
    const vp=page.getViewport({scale:k}); const c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
    const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.9)); return new File([b],"plan.jpg",{type:"image/jpeg"});
  }catch(e){ const err=new Error("pdf"); err.pdf=true; throw err; }
}

// why the AI reading failed, in words the user can act on (shown after the failure message)
function aiWhy(e){ const m=String(e&&(e.message||e.text)||e&&e.code||e||"").toLowerCase();
  let why;
  if(/sign in|not signed|jwt|401/.test(m)) why=tr("الخادم لم يتعرّف على دخولك — اخرج وادخل مرة أخرى");
  else if(/credit|balance|billing|quota/.test(m)) why=tr("رصيد مفتاح Claude في Supabase انتهى");
  else if(/x-api-key|api key|authentication|permission/.test(m)) why=tr("مفتاح Claude في Supabase غير صالح");
  else if(/overloaded|rate|429|529/.test(m)) why=tr("الخدمة مزدحمة الآن، جرّب بعد دقيقة");
  else if(/network|failed to fetch|load failed/.test(m)) why=tr("لا يوجد اتصال بالإنترنت");
  else if(/invalid_json/.test(m)) why=tr("الصورة غير واضحة");
  else why=String(e&&(e.message||e.code)||"").slice(0,90);
  return why?" — "+why:""; }

async function cuRead(id, file){
  const x0=S.cu[id]; if(!x0) return;
  if(!canRead||!sample){ return; }

  try{ const img=await compress(file,1400);
    d=await sample.json(`هذه صورة فاتورة مشتريات (ألمنيوم/زجاج/سيليكون/مواد/وقود). استخرج منها: اسم المورد (البائع الذي أصدر الفاتورة، وليس المشتري)، والمبلغ الإجمالي النهائي شامل الضريبة كرقم فقط، وتاريخ الفاتورة بصيغة YYYY-MM-DD، ووصفاً مختصراً للمشتريات ${lang==="en"?"باللغة الإنجليزية":"بالعربية الفصحى"} في بضع كلمات. أجب بـ JSON فقط بهذا الشكل: {"supplier":"","amount":0,"date":"","desc":"","invoiceNo":"","plate":"","payment":""}. invoiceNo هو رقم الفاتورة أو الإيصال. plate هو رقم لوحة السيارة إن كان مكتوباً في الفاتورة (شائع في فواتير الوقود والصيانة). payment هو "cash" إذا كُتب أن الدفع نقدي، أو "credit" إذا كُتب آجل/Credit، وإلا اتركه فارغاً. اترك الحقل فارغاً إذا لم يكن واضحاً.`,{images:[img],cache:false});
  }catch(e){ console.warn("cu read",e); toast(tr("تعذرت قراءة الفاتورة، أكمل البيانات يدوياً")+aiWhy(e)); }
  const x=S.cu[id]; if(!x) return; delete x.reading;
  if(d&&typeof d==="object"){
    if(d.supplier&&!x.supplier) x.supplier=String(d.supplier).slice(0,120);
    if(n(d.amount)>0&&!n(x.amount)) x.amount=n(d.amount);
    if(/^\d{4}-\d{2}-\d{2}$/.test(d.date||"")) x.date=d.date;
    if(d.desc&&!x.desc) x.desc=String(d.desc).slice(0,160);
    if(!x.cat) x.cat=cuGuessCat(`${x.supplier} ${x.desc} ${d.desc||""}`);
    if(String(x.target||"").startsWith("car:")&&(cuCat(x.cat)||{}).t!=="car") x.cat="fuel";
    if(d.invoiceNo&&!x.invNo) x.invNo=String(d.invoiceNo).slice(0,40);
    if(d.payment==="credit") x.pay="credit";
    if(isCreditSup(x.supplier)){ x.pay="credit"; x.supplier=supCanon(x.supplier); }
    const car=carFromText(d.plate,d.desc,x.desc,x.invNo&&"");
    if(car&&!x.target){ x.target="car:"+car; x.autoCar=car; if((cuCat(x.cat)||{}).t!=="car") x.cat="fuel"; if(S.cuPick===id) S.cuPick=null; setTimeout(()=>toast("🚗 تم التعرّف على السيارة "+car+" من رقم اللوحة"),50); }
    else if(d.plate&&!x.target){ x.plate=String(d.plate).slice(0,20); }
  }
  cuPut(x,true); render();
  if(cuDupOf(x)) setTimeout(()=>{ toast("⚠️ تنبيه: يبدو أن هذه الفاتورة مسجّلة من قبل"); buzzOk(); },400);
}

  try{ await document.fonts.ready; }catch(e){}
  const { jsPDF }=window.jspdf; const pdf=new jsPDF({unit:"mm",format:"a4"}); const W=210,H=297,bottom=14; let y=0;
  for(const el of rep.children){ const cv=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
    let w=W,h=cv.height*w/cv.width; if(h>H-bottom){ h=H-bottom; w=cv.width*h/cv.height; } if(y+h>H-bottom&&y>0){ pdf.addPage(); y=6; }
    pdf.addImage(cv.toDataURL("image/jpeg",0.86),"JPEG",(W-w)/2,y,w,h); y+=h; }
  const pages=pdf.getNumberOfPages(); for(let p=1;p<=pages;p++){ pdf.setPage(p); pdf.setFontSize(8); pdf.setTextColor(120); pdf.text(`${p} / ${pages}`,W/2,H-4,{align:"center"}); }

  catch(err){ if(err&&err.code==="declined") toast("لم يُحفظ الملف"); else throw new Error(err&&err.message||"تعذر الحفظ"); }
}

async function readCheque(p, file){
  try{
    const img = await compress(file, 1400);
    const d = await sample.json(`هذه صورة إثبات دفعة مستلمة لشركة في الإمارات: إما شيك بنكي، أو إشعار تحويل بنكي/لقطة شاشة من تطبيق بنكي، أو سند قبض. حدّد نوعها، واستخرج: المبلغ كرقم فقط، والتاريخ بصيغة YYYY-MM-DD، ورقم الشيك (إن كان شيكاً)، ورقم المرجع (إن كان تحويلاً أو سنداً)، واسم البنك، واسم الدافع أو صاحب الحساب. أجب بـ JSON فقط بهذا الشكل: {"type":"cheque|transfer|cash","amount":0,"date":"","chequeNo":"","ref":"","bank":"","payer":""}. اترك الحقل فارغاً إذا لم يكن واضحاً.`,
      { images:[img], cache:false });
    if(d && typeof d==="object"){
      if(["cheque","transfer","cash"].includes(d.type)) p.method=d.type;
      if(n(d.amount)>0) p.amount=n(d.amount);
      if(/^\d{4}-\d{2}-\d{2}$/.test(d.date||"")) p.date=d.date;
      if(d.chequeNo) p.chequeNo=String(d.chequeNo).slice(0,40);
      if(d.ref) p.ref=String(d.ref).slice(0,60);
      if(d.bank) p.bank=String(d.bank).slice(0,80);
      if((d.payer||d.drawer) && !p.note) p.note=String(d.payer||d.drawer).slice(0,120);
      save(site()); toast(p.method==="transfer"?"تمت قراءة إشعار التحويل، راجع المبلغ والتاريخ":"تمت قراءة الشيك، راجع المبلغ والتاريخ");
    }
  }catch(e){ toast(tr("تعذرت القراءة، أدخل البيانات يدوياً")+aiWhy(e)); }
}
async function attachInvoice(s, p, file, b){
  let f=file;
  if(f.type==="application/pdf"||/\.pdf$/i.test(f.name||"")){ const pages=await pdfPages(f,1); f=pages[0]; }
  const r=await upload(f); if(!r) return;
  if(!p.cuId) dropAsset(p.fileId); p.fileId=r.id; p.fileType=r.type; save(s);
  if(r.type!=="image") return;
  if(!canRead){ toast("قراءة الفاتورة تلقائياً غير متاحة في هذا العرض، أدخل المبلغ والمورد يدوياً"); return; }
  if(b) b.textContent=tr("جارٍ قراءة الفاتورة…");
  await readInvoice(p, f);
}
async function readInvoice(p, file){
  try{
    const img = await compress(file, 1400);
    const d = await sample.json(`هذه صورة فاتورة مشتريات (ألمنيوم/زجاج/سيليكون/مواد). استخرج منها: اسم المورد (البائع الذي أصدر الفاتورة، وليس المشتري)، والمبلغ الإجمالي النهائي شامل الضريبة كرقم فقط، وتاريخ الفاتورة بصيغة YYYY-MM-DD، ووصفاً مختصراً للمشتريات ${lang==="en"?"باللغة الإنجليزية":"بالعربية الفصحى"} في بضع كلمات. أجب بـ JSON فقط بهذا الشكل: {"supplier":"","amount":0,"date":"","desc":""}. اترك الحقل فارغاً إذا لم يكن واضحاً.`,
      { images:[img], cache:false });
    if(d && typeof d==="object"){
      if(!d.supplier && !(n(d.amount)>0)) { toast("لم أجد المبلغ أو اسم المورد في الصورة، صوّر الفاتورة بوضوح أو أدخلها يدوياً"); return; }
      if(d.supplier) p.supplier=String(d.supplier).slice(0,120);
      if(n(d.amount)>0) p.amount=n(d.amount);
      if(/^\d{4}-\d{2}-\d{2}$/.test(d.date||"")) p.date=d.date;
      if(d.desc && !p.desc) p.desc=String(d.desc).slice(0,160);
      save(site()); toast("تمت قراءة الفاتورة، راجع المبلغ واسم المورد");
    }
  }catch(e){ console.warn("invoice read",e);
    const c=e&&e.code; toast(c==="not_granted"?"لم يُسمح بقراءة الفاتورة. اضغط «قراءة الفاتورة» واختر السماح":c==="rate_limited"?"محاولات كثيرة، انتظر قليلاً ثم اضغط «قراءة الفاتورة»":c==="image_rejected"?"صيغة الصورة غير مدعومة، صوّرها مرة أخرى":"تعذرت قراءة الفاتورة، اضغط «قراءة الفاتورة» للمحاولة مرة أخرى"); }
}
function summaryText(s){
  const c=calc(s), L=tr, cur=L("درهم");
  const lines=[`*${L("تقرير موقع")}: ${s.name}*`, coName(), `${L("التاريخ")}: ${today()}`,
    `${L("الموقع")}: ${s.location||"—"}`, `${L("المهندس")}: ${s.engineer||"—"} ${s.engPhone||""}`, `${L("الاستشاري")}: ${s.consultant||"—"}`, "",
    ...(isEng()?[]:[`${L("إجمالي قيمة المشروع")}: ${money(c.total)} ${cur}`, `${L("المستلم")}: ${money(c.received)} ${cur}`, `${L("المتبقي")}: ${money(c.remaining)} ${cur}`, `${L("إجمالي المشتريات")}: ${money(c.spent)} ${cur}`, ""]),
    `${L("نسبة الإنجاز")}: ${c.pct}%`];
  s.items.forEach(it=>lines.push(`- ${dEN(it.name)}: ${n(it.qty)} | ${STAGES.map(([k,l])=>`${L(l)} ${n(it[k])}`).join(" | ")}`));
  if(s.notes) lines.push("", `${L("ملاحظات")}: ${s.notes}`);
  return lines.join("\n");
}

/* ---------- PDF ---------- */
function numWords(n){ n=Math.floor(n); if(n===0) return "Zero";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"], t=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const h=x=>{ let r=""; if(x>=100){ r+=a[Math.floor(x/100)]+" Hundred"; x%=100; if(x) r+=" "; } if(x>=20){ r+=t[Math.floor(x/10)]; if(x%10) r+="-"+a[x%10]; } else if(x) r+=a[x]; return r; };
  const parts=[[1e9,"Billion"],[1e6,"Million"],[1e3,"Thousand"],[1,""]]; let out=[];
  for(const [v,l] of parts){ const q=Math.floor(n/v); if(q){ out.push(h(q)+(l?" "+l:"")); n%=v; } } return out.join(" "); }
function amountWords(x){ const tot=Math.round(x*100); const d=Math.floor(tot/100), f=tot%100;
  return `${numWords(d)} Dirham${d===1?"":"s"}${f?` and ${numWords(f)} Fils`:""} Only.`; }
const m2=x=>n(x).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
function vatSplit(gross,rate){ const g=Math.round(n(gross)*100)/100; const net=Math.round(g/(1+rate/100)*100)/100; return {net,vat:Math.round((g-net)*100)/100,gross:g}; }
const ORD=["First","Second","Third","Fourth","Fifth","Sixth","Seventh","Eighth","Ninth","Tenth","Eleventh","Twelfth"];

      return `<tr><td>${U(it.name)}</td><td class="num">${q}</td>${STAGES.map(([k])=>`<td class="num">${n(it[k])} / ${q}</td>`).join("")}<td><span class="pbar"><i style="width:${p}%"></i></span> <span class="num">${p}%</span></td></tr>`; }).join("")}</table></div>`);
  floors(s).forEach(fl=>{
    const fr=activeFaces(fl).map(([k,l])=>({k,l,f:fl.faces[k],rows:faceRows(s,fl.faces[k])})).filter(x=>x.rows.length||x.f.fileId);
    if(!fr.length && !fl.fileId) return;
    blocks.push(`<div class="rb"><h2><bdi class="u">${esc(dEN(fl.name))}</bdi> — ملخص الواجهات</h2><table><tr><th>الواجهة</th><th>البند</th><th>المطلوب</th><th>المعلّم</th>${STAGES.map(([,l],i)=>`<th style="color:${MCOL[i+1]}">${l}</th>`).join("")}<th>المتبقي للإنهاء</th><th>مقارنة الخريطة بالمطلوب</th></tr>
      ${fr.map(x=>x.rows.map((r,j)=>`<tr><td>${j===0?x.l:""}</td><td>${U(r.it.name)}</td><td class="num">${r.q}</td><td class="num">${r.marked}</td>${r.st.map((v,i)=>`<td class="num" style="color:${v?MCOL[i+1]:"#9aa5ab"};font-weight:600">${v} / ${Math.max(r.q,r.marked)}</td>`).join("")}<td class="num" style="font-weight:700">${Math.max(r.q,r.marked)-r.st[2]}</td><td>${diffChip(r)}</td></tr>`).join("")).join("")}</table></div>`);
    const shr=activeFaces(fl).filter(([k])=>!fl.faces[k].fileId);
    const lists=(ms)=>`<table style="margin-top:10px"><tr><th>المرحلة</th><th>ما تم إنجازه (حسب الترقيم في الرسم)</th><th>المتبقي</th></tr>
      ${STAGES.map(([k,l],i)=>{ const d=ms.filter(m=>mf(m)[k]), r=ms.filter(m=>!mf(m)[k]);
        return `<tr><td><span class="dot" style="background:${MCOL[i+1]}"></span> ${l}</td><td><bdi class="u">${esc(d.map(m=>mLabel(s,m,ms)).join("، ")||"—")}</bdi></td><td><bdi class="u">${esc(r.map(m=>mLabel(s,m,ms)).join("، ")||"—")}</bdi></td></tr>`; }).join("")}</table>`;
    if(fl.fileId){ const all=shr.flatMap(([k])=>fl.faces[k].marks||[]);
      blocks.push(`<div class="rb"><h2>خريطة <bdi class="u">${esc(dEN(fl.name))}</bdi> — كل الواجهات</h2><div class="rplan">${planHtml(s,fl,fl.fileId,imgs[fl.fileId],all.map(m=>markHtml(s,m,false)).join(""),{full:true})}</div>
      <div class="legend" style="margin-top:8px;font-size:12px">${legendHtml(s,all)}</div></div>`);
      shr.forEach(([k,l])=>{ const ms=fl.faces[k].marks||[]; if(!ms.length) return;
        blocks.push(`<div class="rb"><h3 style="margin:0 0 4px">${l}</h3>${lists(ms)}</div>`); });
    }
    FACES.filter(([k])=>fl.faces[k].fileId).forEach(([k,l])=>{ const f=fl.faces[k]; const ms=f.marks||[];
      blocks.push(`<div class="rb"><h2>${l} — <bdi class="u">${esc(dEN(fl.name))}</bdi></h2><div class="rplan">${planHtml(s,fl,f.fileId,imgs[f.fileId],ms.map(m=>markHtml(s,m,false,ms)).join(""),{})}</div>
      <div class="legend" style="margin-top:8px;font-size:12px">${legendHtml(s,ms)}</div>${ms.length?lists(ms):""}</div>`); });
  });
  [["","صور الموقع"],...usedFaces(s).map(([k,l])=>[k,"صور "+l])].forEach(([k,title])=>{ const ph=s.photos.filter(p=>(p.face||"")===k);
    for(let i=0;i<ph.length;i+=2) blocks.push(`<div class="rb">${i===0?`<h2>${title}</h2>`:""}<div class="ph">${ph.slice(i,i+2).map(p=>`<figure><img src="${imgs[p.fileId]}"><figcaption>${U(p.caption||"")}</figcaption></figure>`).join("")}</div></div>`); });
  { const vn=(s.voiceNotes||[]).slice(0,6); if(vn.length) blocks.push(`<div class="rb"><h2>ملاحظات الموقع</h2>${vn.map(n=>`<div style="margin:0 0 10px"><b class="num">${U(n.date||"")}</b>${n.by?` — ${U(n.by)}`:""}${n.summary?`<div><b>${U(n.summary)}</b></div>`:""}${
      NOTE_KEYS.some(([k])=>(n[k]||[]).length)?NOTE_KEYS.filter(([k])=>(n[k]||[]).length).map(([k,l])=>`<div>${l}<ul style="margin:2px 0 4px">${n[k].map(t=>`<li>${U(t)}</li>`).join("")}</ul></div>`).join(""):`<p style="margin:2px 0;white-space:pre-wrap">${U(n.text||"")}</p>`}</div>`).join("")}</div>`); }
  { const iss=s.issues||[]; if(iss.length){
    blocks.push(`<div class="rb"><h2>المشاكل الفنية — مفتوحة <span class="num">${iss.filter(x=>x.status!=="done").length}</span> / <span class="num">${iss.length}</span></h2><table><tr><th>التاريخ</th><th>الواجهة</th><th>المشكلة</th><th>المسؤول / الإجراء</th><th>الحالة</th></tr>
      ${iss.map((x,i)=>`<tr><td class="num">${U(x.date)}</td><td>${faceName(x.face)}</td><td>${U(x.text||"—")}${x.fileId?` <span class="num">(صورة ${i+1})</span>`:""}</td><td>${U(x.action||"—")}</td><td><span class="chip ${x.status==="done"?"done":"ex"}">${x.status==="done"?"تم الحل":"مفتوحة"}</span></td></tr>`).join("")}</table></div>`);
    const ip=iss.map((x,i)=>({x,i})).filter(o=>o.x.fileId);
    for(let j=0;j<ip.length;j+=2) blocks.push(`<div class="rb">${j===0?"<h3 style=\"margin:0 0 6px\">صور المشاكل الفنية</h3>":""}<div class="ph">${ip.slice(j,j+2).map(o=>`<figure><img src="${imgs[o.x.fileId]}"><figcaption>صورة <span class="num">${o.i+1}</span> — ${U(o.x.text||"")}</figcaption></figure>`).join("")}</div></div>`);
  } }
  if(s.notes) blocks.push(`<div class="rb"><h2>ملاحظات</h2><p style="margin:0;white-space:pre-wrap">${U(s.notes)}</p></div>`);
  }
  rep.innerHTML=blocks.join(""); translate(rep);
  await Promise.all([...rep.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
  try{ await document.fonts.ready; }catch(e){}
  const { jsPDF } = window.jspdf; const pdf=new jsPDF({unit:"mm",format:"a4"});
  const W=210, H=297, M=0, bottom=18; let y=0;
  for(const el of rep.children){
    const cv=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
    let w=W-2*M, h=cv.height*w/cv.width;
    if(h>H-bottom){ h=H-bottom; w=cv.width*h/cv.height; }
    if(y+h>H-bottom && y>0){ pdf.addPage(); y=6; }
    pdf.addImage(cv.toDataURL("image/jpeg",0.86),"JPEG",(W-w)/2,y,w,h); y+=h;
  }
  const pages=pdf.getNumberOfPages();
  let foot=null; try{ const fe=document.createElement("div"); fe.className="lhfoot"; fe.innerHTML=`<span class="u">${lang==="en"?esc(co.companyEn||co.company):esc(co.company)}</span>${[co.phone,co.email].filter(Boolean).map(x=>`<span dir="ltr">${esc(x)}</span>`).join("")}`;
    rep.appendChild(fe); translate(fe); const fc=await html2canvas(fe,{scale:2,backgroundColor:"#ffffff",logging:false}); foot={d:fc.toDataURL("image/png"),r:fc.height/fc.width}; fe.remove(); }catch(e){}
  for(let p=1;p<=pages;p++){ pdf.setPage(p);
    if(foot){ const fw=W-24, fh=fw*foot.r; pdf.addImage(foot.d,"PNG",12,H-fh-6.5,fw,fh); }
    pdf.setDrawColor(17,130,58); pdf.setLineWidth(0.4); pdf.line(12,H-7.5-(foot?(W-24)*foot.r:0),W-12,H-7.5-(foot?(W-24)*foot.r:0));
    pdf.setFontSize(8); pdf.setTextColor(120); pdf.text(`${p} / ${pages}`,W/2,H-3,{align:"center"}); }
  rep.innerHTML="";
  const fname=`${tr(kind==="fin"?"التقرير المالي":kind==="pur"?"التقرير الداخلي":"تقرير الأعمال")} ${s.name} ${today()}.pdf`.replace(/[\\/:*?"<>|]/g,"-");
  const blob=pdf.output("blob");
  if(!downloads) throw new Error(tr("الحفظ غير متاح في هذا العرض"));
  try{ await downloads.save({filename:fname,data:blob}); S.lastPdf=s.id; }
  catch(err){ if(err&&err.code==="declined") toast("لم يُحفظ الملف"); else throw new Error(err&&err.message||"تعذر الحفظ"); }
}

app.addEventListener("load", e=>{ const im=e.target; if(!im||im.id!=="planImg"||!im.naturalWidth) return; const s=site(); if(!s) return; const fl=floors(s).find(x=>x.id===im.dataset.fl); if(!fl) return;
  const a=+(im.naturalHeight/im.naturalWidth).toFixed(5); if(Math.abs((fl.aspect||0)-a)>0.0005){ fl.aspect=a; save(s); render(); } }, true);
/* ---------- voice notes: speak → text (phone's speech recognition) → summary (Claude) → saved to the site; issues go to «المشاكل» ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceRec = null;
const NOTE_KEYS = [["done","✅ الأعمال المنجزة"],["issues","⚠️ المشاكل"],["needs","📋 المطلوبات والنواقص"],["requests","📌 طلبات الاستشاري أو العميل"]];
const vnLines = t => String(t||"").split("\n").map(x=>x.replace(/^\s*[-•*·]\s*/,"").trim()).filter(Boolean);

function voiceSheet(){
  const v=S.voice; if(!v) return "";
  if(v.stage==="review"){ const m=v.sum||{};
    return `<div class="sheet vnsheet" role="dialog" aria-label="مراجعة الملاحظة"><h3>🎤 راجع الملخص قبل الحفظ</h3>
      <label>الملخص<input id="vn-summary" value="${esc(m.summary||"")}"></label>
      ${NOTE_KEYS.map(([k,l])=>`<label>${l}<textarea id="vn-${k}" rows="${Math.max(2,(m[k]||[]).length+1)}">${esc((m[k]||[]).join("\n"))}</textarea></label>`).join("")}
      <p class="small muted" style="margin:0">كل سطر بند مستقل. ما في «المشاكل» يُضاف إلى تبويب المشاكل في الموقع.</p>
      <div class="row"><button class="primary big" data-act="vnsave">💾 حفظ</button><button data-act="vnback">→ رجوع إلى النص</button><button class="ghost" data-act="vnx">إلغاء</button></div></div>`; }
  return `<div class="sheet vnsheet" role="dialog" aria-label="ملاحظة صوتية"><h3>🎤 ملاحظة صوتية — <bdi>${esc((S.sites[v.siteId]||{}).name||"")}</bdi></h3>
    ${SR?`<button class="vnrec ${v.rec?"on":""}" data-act="vnrec">${v.rec?"⏹ إيقاف التسجيل":"🎤 ابدأ التسجيل"}</button>
      <p class="small muted" style="margin:0">${v.rec?tr("تكلّم بشكل طبيعي… الكلام يُكتب أدناه."):tr("اضغط وتكلّم: ماذا أُنجز، وما المشاكل، وما الناقص، وما طلب الاستشاري.")}</p>`
      :`<p class="small notice" style="margin:0">${tr("التسجيل من داخل التطبيق غير مدعوم في هذا المتصفح. اضغط 🎤 في لوحة المفاتيح وتكلّم داخل الخانة.")}</p>`}
    <label>النص<textarea id="vn-text" rows="5" placeholder="${esc(tr("مثال: اليوم ركّبنا فريم الطابق الأول، وناقص زجاج ثلاث شبابيك، والاستشاري طلب تعديل باب المدخل."))}">${esc(v.text||"")}</textarea></label>
    <div class="row"><button class="primary big" data-act="vnsum">✨ لخّص وراجع</button><button data-act="vnsaveraw">💾 حفظ النص فقط</button><button class="ghost" data-act="vnx">إلغاء</button></div></div>`;
}

function recStart(){
  const v=S.voice; if(!SR||!v) return;
  const rec=new SR(); rec.lang=lang==="en"?"en-US":"ar-AE"; rec.continuous=true; rec.interimResults=true;
  let base=v.text?v.text.trim()+" ":"";
  rec.onresult=e=>{ let fin="", mid="";
    for(let i=0;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin+=r[0].transcript+" "; else mid+=r[0].transcript; }
    v.text=(base+fin).replace(/\s+/g," ").trim();
    const el=document.getElementById("vn-text"); if(el) el.value=v.text+(mid?" "+mid:""); };
  rec.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ v.rec=false; toast("اسمح للتطبيق باستخدام الميكروفون من إعدادات المتصفح"); render(); } };
  // phones stop listening after a pause: keep going until the user presses stop
  rec.onend=()=>{ if(v.rec&&S.voice===v){ base=v.text?v.text+" ":""; try{ rec.start(); return; }catch(x){} } v.rec=false; render(); };
  voiceRec=rec; v.rec=true; try{ rec.start(); }catch(x){ v.rec=false; } render();
}
function recStop(){ const v=S.voice; if(v) v.rec=false; try{ voiceRec&&voiceRec.stop(); }catch(x){} voiceRec=null; }

async function vnSummarize(btn){
  const v=S.voice; if(!v) return; recStop();
  const el=document.getElementById("vn-text"); if(el) v.text=el.value.trim();
  if(!v.text){ toast("لا يوجد كلام بعد"); return; }
  if(!sample){ toast("التلخيص غير متاح الآن — احفظ النص فقط"); return; }
  btn.disabled=true; btn.textContent=tr("⏳ جارٍ التلخيص…");
  try{
    const d=await sample.json(`تفريغ صوتي لملاحظة من موقع أعمال ألمنيوم وزجاج. لخّصه بالعربية الفصحى دون إضافة ما لم يُذكر، واستخدم «الفريم» لا «الإطار». أجب بـ JSON فقط: {"summary":"جملة واحدة","done":[],"issues":[],"needs":[],"requests":[]} — done الأعمال المنجزة، issues المشاكل الفنية، needs المطلوبات والنواقص، requests طلبات الاستشاري أو العميل.\n\nالنص:\n${v.text}`,{text:v.text,cache:false});
    const arr=x=>Array.isArray(x)?x.map(t=>String(t).trim()).filter(Boolean):[];
    v.sum={summary:String(d&&d.summary||"").trim(),done:arr(d&&d.done),issues:arr(d&&d.issues),needs:arr(d&&d.needs),requests:arr(d&&d.requests)};
    v.stage="review"; render();
  }catch(err){ btn.disabled=false; btn.textContent=tr("✨ لخّص وراجع");
    toast(err&&err.code==="unsupported"?"التلخيص يحتاج تحديث دالة read-doc في Supabase — يمكنك حفظ النص الآن":"تعذر التلخيص — يمكنك حفظ النص فقط"); }
}

function vnSave(raw){
  const v=S.voice; if(!v) return; const s=S.sites[v.siteId]; if(!s) return;
  if(!raw&&v.stage!=="review") return;
  const val=id=>(document.getElementById(id)||{}).value;
  if(raw){ const el=document.getElementById("vn-text"); if(el) v.text=el.value.trim(); if(!v.text){ toast("لا يوجد كلام بعد"); return; } }
  const note={id:uid(),date:today(),by:(S.user&&S.user.name)||cuMe||"",text:v.text||""};
  if(!raw){ note.summary=String(val("vn-summary")||"").trim(); NOTE_KEYS.forEach(([k])=>{ note[k]=vnLines(val("vn-"+k)); }); }
  s.voiceNotes=[note,...(s.voiceNotes||[])];
  let added=0;
  if(!raw){ s.issues=s.issues||[]; [...note.issues].reverse().forEach(t=>{ s.issues.unshift({id:uid(),date:note.date,face:"",text:t,action:"",status:"open",fileId:null,src:"voice",noteId:note.id}); added++; }); }
  recStop(); S.voice=null; save(s); render();
  toast(added?tr("✓ حُفظت الملاحظة، وأُضيفت إلى «المشاكل»: ")+added:tr("✓ حُفظت الملاحظة"));
}

function voiceNotesPanel(s){
  const L=s.voiceNotes||[]; if(!L.length) return "";
  const show=S.vnAll===s.id?L:L.slice(0,3);
  return `<div class="panel"><div class="row" style="justify-content:space-between"><h2>🎤 ملاحظات الموقع</h2><span class="chip"><span class="num">${L.length}</span></span></div>
   <div class="list">${show.map(n=>`<div class="entry vnote"><div class="full row" style="justify-content:space-between"><span class="small muted"><span class="num">${esc(n.date||"")}</span>${n.by?" — "+esc(n.by):""}</span>
     ${(isAdmin()||(S.user&&S.user.name===n.by))?`<button class="ghost small danger ${S.armed==="vn"+n.id?"armed":""}" data-act="vndel" data-id="${n.id}">${S.armed==="vn"+n.id?"تأكيد الحذف":"حذف"}</button>`:""}</div>
     ${n.summary?`<b class="full">${esc(n.summary)}</b>`:""}
     ${NOTE_KEYS.some(([k])=>(n[k]||[]).length)?NOTE_KEYS.filter(([k])=>(n[k]||[]).length).map(([k,l])=>`<div class="full small"><b>${l}</b><ul>${n[k].map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`).join("")
       :`<p class="full small" style="margin:0;white-space:pre-wrap">${esc(n.text||"")}</p>`}</div>`).join("")}</div>
   ${L.length>3&&S.vnAll!==s.id?`<button class="ghost small" data-act="vnall">${tr("عرض كل الملاحظات")} (<span class="num">${L.length}</span>)</button>`:""}</div>`;
}

app.addEventListener("input",e=>{ if(e.target.id==="vn-text"&&S.voice&&!S.voice.rec) S.voice.text=e.target.value; });
app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act; if(!/^vn/.test(a)) return;
  const s=site();
  if(a==="vnrec"){ if(S.voice&&S.voice.rec){ recStop(); render(); } else recStart(); }
  else if(a==="vnx"){ recStop(); S.voice=null; render(); }
  else if(a==="vnsum") await vnSummarize(b);
  else if(a==="vnback"){ S.voice.stage="text"; render(); }
  else if(a==="vnsave") vnSave(false);
  else if(a==="vnsaveraw") vnSave(true);
  else if(a==="vnall"&&s){ S.vnAll=s.id; render(); }
  else if(a==="vndel"&&s){ const k="vn"+b.dataset.id; if(S.armed===k){ S.armed=null; s.voiceNotes=(s.voiceNotes||[]).filter(n=>n.id!==b.dataset.id); save(s); render(); }
    else { S.armed=k; setTimeout(()=>{ if(S.armed===k){ S.armed=null; render(); } },4000); render(); } }
});
window.addEventListener("pagehide",()=>flushAll());
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") Object.keys(dirty).forEach(id=>{ if(dirty[id]){ clearTimeout(timers[id]); flush(id); } }); });
document.getElementById("savePill").addEventListener("click",()=>{ if(saveState.err) retryAll(); });
async function saveNow(btn){
  const a=document.activeElement; if(a&&a.blur) a.blur();
  await new Promise(r=>setTimeout(r,60));
  flushAll();
  if(btn){ btn.disabled=true; btn.textContent=tr("جارٍ الحفظ…"); }
  const t0=Date.now(); while((saveState.pending>0)&&Date.now()-t0<15000) await new Promise(r=>setTimeout(r,150));
  await Promise.all(Object.values(chains)).catch(()=>{});
  const failed=!!saveState.err||Object.keys(S.sites).some(id=>dirty[id]);
  document.querySelectorAll(".savenow").forEach(x=>{ x.disabled=false; x.classList.remove("unsaved"); x.textContent=failed?tr("💾 حفظ التعديلات"):tr("✓ تم الحفظ"); });
  if(!failed) setTimeout(markUnsaved,2500);
  toast(failed?"لم يُحفظ — تحقق من الاتصال ثم اضغط «حفظ» مرة أخرى":"✓ تم حفظ كل البيانات");
}
app.addEventListener("click",e=>{ const b=e.target.closest('[data-act="savenow"]'); if(!b) return; e.preventDefault(); e.stopImmediatePropagation(); saveNow(b); }, true);
boot();
})();
</script>
