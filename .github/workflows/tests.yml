name: Tests and publish
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  app:
    name: App (build + browser tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tests } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
  database:
    name: Database rules (Supabase SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/sql/run.sh
  publish:
    name: Publish app (GitHub Pages)
    # only from main, and only after every test passed
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [app, database]
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write, contents: read }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    concurrency: { group: pages, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: app }
      - id: deploy
        uses: actions/deploy-pages@v4
