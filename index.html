.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--glass);border-radius:50%;animation:sp 1s linear infinite}

.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}

.btn:disabled{opacity:.55}
.btn.wide{width:100%}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.pcard:focus-visible,.segb:focus-visible{outline:3px solid #8cc2ea;outline-offset:2px}
.link{background:none;border:0;color:var(--glass);font-weight:600;padding:6px;cursor:pointer}
.form{gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}

.row-btns>*{flex:1 1 140px}

.auth-logo{width:84px;height:84px;border-radius:20px}
.auth .card{width:100%;text-align:start;margin-top:10px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.toolbar .search{flex:1 1 200px}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}

.pct{font-variant-numeric:tabular-nums;color:var(--glass);font-weight:700}
.meter{height:6px;background:var(--glass-soft);border-radius:4px;overflow:hidden}

.meter i{display:block;height:100%;background:var(--glass);border-radius:4px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;color:var(--steel)}

.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 16px;font-weight:600;cursor:pointer;color:var(--steel)}

#tabBody{display:flex;flex-direction:column;gap:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #edf1f5;align-items:baseline}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--steel);font-size:13.5px;flex:0 0 auto}
.kv>span:last-child{text-align:end;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

.notes p{margin:4px 0 0;white-space:pre-wrap}
.task{display:flex;flex-direction:column;gap:6px;padding:6px 0}
.task-name{font-weight:600}

.rep-ph img{width:100%;height:250px;object-fit:cover;border-radius:6px;border:1px solid #d8e0e9}
.rep .avoid{break-inside:avoid;page-break-inside:avoid}
.rep-foot{margin-top:18px;font-size:12px;color:#5d7186;border-top:1px solid #d8e0e9;padding-top:8px}
.rep .notes{white-space:pre-wrap;border:1px solid #d8e0e9;padding:8px;border-radius:6px}

const pref = () => db.collection('projects').doc(S.pid);
const byDate = (a,b) => String(b.date||'').localeCompare(String(a.date||''));
const spinner = () => '<div class="center"><div class="spin"></div></div>';
function today(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function fmtDate(d){ try { return d.toLocaleDateString(lang==='ar' ? 'ar-AE-u-nu-latn' : 'en-GB', {year:'numeric',month:'short',day:'numeric'}); } catch(e){ return d.toISOString().slice(0,10); } }
const fmtTs = ts => ts && ts.toDate ? fmtDate(ts.toDate()) : '';
function progress(p){ const w = p.work || {}; return Math.round(((Number(w.frame)||0)+(Number(w.silicone)||0)+(Number(w.glass)||0)) / 6 * 100); }
function waNum(ph){ let d = String(ph).replace(/\D/g,''); if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0')) d = '971' + d.slice(1); return d; }
const kv = (k,v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
function field(name,label,type='text',val='',req=false,dir=''){
  const extra = type==='number' ? 'inputmode="decimal" step="any" min="0"' : '';
  return `<label class="fld"><span>${label}</span><input id="f_${name}" name="${name}" type="${type}" value="${esc(val)}" ${req?'required':''} ${dir?`dir="${dir}"`:''} ${extra}></label>`;
}

function toast(msg){ const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { el.hidden = true; }, 3000); }
function errMsg(err){
  const c = (err && err.code) || '';
  if (['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c)) return t('errAuth');
  if (c === 'auth/email-already-in-use') return t('errEmailUsed');
  if (c === 'auth/weak-password') return t('errWeak');
  if (c === 'auth/invalid-email') return t('errEmail');
  if (c === 'permission-denied' || c === 'firestore/permission-denied') return t('errPerm');
  return t('errGeneric');
}
function fail(err){ console.error(err); toast(errMsg(err)); }

function openSheet(html){ const s = $('#sheet'); s.innerHTML = `<div class="sheet-bg" data-act="closeSheet"></div><div class="sheet">${html}</div>`; s.hidden = false; }
function closeSheet(){ const s = $('#sheet'); s.hidden = true; s.innerHTML = ''; }
function confirmSheet(msg, fn){ S.confirmFn = fn; openSheet(`<p>${msg}</p><div class="row-btns"><button class="btn danger" data-act="confirmYes">${t('confirmDel')}</button><button class="btn" data-act="closeSheet">${t('cancel')}</button></div>`); }

function setLang(l){
  lang = l; try { localStorage.setItem('sr_lang', l); } catch(e) {}
  document.documentElement.lang = l; document.documentElement.dir = l==='ar' ? 'rtl' : 'ltr';
  render();
}

  if (S.view === 'staff') title = t('staff');

  const arrow = lang==='ar' ? '→' : '←';

function render(){
  document.title = t('appName');

const curProject = () => S.projects.find(p => p.id === S.pid);

async function finance(pid, withPurchases){
  const ref = db.collection('projects').doc(pid);
  const jobs = [ref.collection('finance').doc('main').get(), ref.collection('payments').get()];
  if (withPurchases) jobs.push(ref.collection('purchases').get());
  const [m, pays, purs] = await Promise.all(jobs);
  const payments = pays.docs.map(d => ({id:d.id, ...d.data()})).sort(byDate);
  const purchases = purs ? purs.docs.map(d => ({id:d.id, ...d.data()})).sort(byDate) : [];
  const received = payments.reduce((s,x) => s + num(x.amount), 0);
  const purchTotal = purchases.reduce((s,x) => s + num(x.amount), 0);
  return { total: m.exists ? num(m.data().total) : 0, received, purchTotal, payments, purchases };
}

async function renderProject(){
  const app = $('#app'); const p = curProject();
  if (!p) { S.missing = true; app.innerHTML = spinner(); return; }
  const tabs = ['info','work','photos'].concat(isAdmin() ? ['payments','purchases'] : []);
  app.innerHTML = `<nav class="tabs">${tabs.map(k => `<button class="tab ${S.tab===k?'on':''}" data-act="tab" data-id="${k}">${t(k)}</button>`).join('')}</nav>
    <div id="tabBody">${spinner()}</div>
    <div class="actions"><button class="btn primary wide" data-act="pdf">${t('shareReport')}</button></div>`;
  const token = S.tok = Math.random();
  try {
    let html = '';
    if (S.tab === 'info') html = await infoTab(p);
    else if (S.tab === 'work') html = workTab(p);
    else if (S.tab === 'photos') html = await photosTab();
    else if (S.tab === 'payments') html = await paymentsTab();
    else if (S.tab === 'purchases') html = await purchasesTab();
    const body = $('#tabBody');
    if (token === S.tok && body) body.innerHTML = html;
  } catch (e) { fail(e); }
}

}
async function makePdf(html, fname){
  openSheet(`<div class="center" style="padding:24px 0;flex-direction:column;align-items:center;gap:12px"><div class="spin"></div><div>${t('preparing')}</div></div>`);
  const host = document.createElement('div'); host.className = 'pdf-host'; host.innerHTML = html; document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await Promise.all([...host.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    const blob = await html2pdf().set({
      margin:[6,6,8,6], image:{type:'jpeg', quality:0.88},
      html2canvas:{scale:2, backgroundColor:'#ffffff', useCORS:true},
      jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
      pagebreak:{mode:['css','legacy'], avoid:['.avoid','tr']}
    }).from(host.firstElementChild).outputPdf('blob');
    S.pdfFile = new File([blob], fname, {type:'application/pdf'});
    openSheet(`<h3>${t('reportReady')}</h3><div class="muted small" dir="ltr">${esc(fname)}</div>
      <button class="btn primary" data-act="sharePdf">${t('share')}</button><button class="btn" data-act="downloadPdf">${t('download')}</button><button class="btn" data-act="closeSheet">${t('close')}</button>`);
  } finally { host.remove(); }
}
function downloadPdf(){
  const u = URL.createObjectURL(S.pdfFile); const a = document.createElement('a');
  a.href = u; a.download = S.pdfFile.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 5000); toast(t('downloaded'));
}
const safeName = s => String(s||'report').replace(/[\\/:*?"<>|]+/g,' ').trim().slice(0,60);

/* ---------- images ---------- */
function loadImg(src){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
async function compress(file, max, q){
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImg(url);
    let w = im.naturalWidth, h = im.naturalHeight; const r = Math.min(1, max / Math.max(w, h));
    w = Math.round(w * r); h = Math.round(h * r);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,w,h); g.drawImage(im, 0, 0, w, h);
    let out = c.toDataURL('image/jpeg', q);
    while (out.length > 850000 && q > 0.25) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- navigation & data ---------- */
function goHome(){
  S.view = 'home'; S.pid = null; S.editing = false;
  if (!S.unsub) {
    S.unsub = db.collection('projects').orderBy('updatedAt','desc').onSnapshot(q => {
      S.projects = q.docs.map(d => ({id:d.id, ...d.data()}));
      if (S.view === 'home') { const pl = $('#plist'); if (pl) pl.innerHTML = projectList(); else render(); }
      if (S.view === 'project' && S.missing) { S.missing = false; render(); }
    }, fail);
  }
  render();
}
function openProject(id, tab){ S.view = 'project'; S.pid = id; S.tab = tab || 'info'; S.missing = false; window.scrollTo(0,0); render(); }

async function loadProfile(){
  const u = S.user; const owner = (u.email || '').toLowerCase() === OWNER_EMAIL;
  if (owner && !u.emailVerified) { S.view = 'verify'; render(); return; }
  if (owner) await u.getIdToken(true);
  const ref = db.collection('users').doc(u.uid);
  let snap = await ref.get();
  if (!snap.exists) {
    await ref.set({ name: S.pendingName || u.displayName || u.email, email: u.email, role: owner ? 'admin' : 'pending', createdAt: FV.serverTimestamp() });
    snap = await ref.get();
  }
  S.profile = snap.data();
  if (owner && S.profile.role !== 'admin') { await ref.update({role:'admin'}); S.profile.role = 'admin'; }
  if (S.profile.role === 'pending') { S.view = 'pending'; render(); return; }
  goHome();
}

auth.onAuthStateChanged(u => {
  S.user = u;
  if (S.unsub) { S.unsub(); S.unsub = null; }
  S.projects = [];
  if (!u) { S.profile = null; S.view = 'auth'; render(); return; }
  S.view = 'loading'; render();
  loadProfile().catch(e => { fail(e); S.view = 'pending'; render(); });
});

const ACT = {
  lang(){ setLang(lang === 'ar' ? 'en' : 'ar'); },
  closeSheet,
  async confirmYes(){ const fn = S.confirmFn; S.confirmFn = null; closeSheet(); if (fn) await fn(); },
  authMode(){ S.authMode = S.authMode === 'signup' ? 'login' : 'signup'; render(); },
  async forgot(){ const em = ($('#f_email').value || '').trim(); if (!em) { toast(t('enterEmail')); return; } await auth.sendPasswordResetEmail(em); toast(t('resetSent')); },
  async verified(){ await S.user.reload(); S.user = auth.currentUser; if (S.user.emailVerified) { S.view = 'loading'; render(); await loadProfile(); } else toast(t('notVerifiedYet')); },
  async resend(){ await S.user.sendEmailVerification(); toast(t('sentAgain')); },
  async recheck(){ S.view = 'loading'; render(); await loadProfile(); },
  async logout(){ closeSheet(); await auth.signOut(); },
  menu(){
    openSheet(`<div class="menu">${S.profile ? `<div class="who"><b>${esc(S.profile.name)}</b><span class="muted small" dir="ltr" style="text-align:start">${esc(S.user.email)}</span><span class="muted small">${t('role_' + S.profile.role)}</span></div>` : ''}
      ${isAdmin() ? `<button class="mi" data-act="goStaff">${t('staff')}</button><button class="mi" data-act="goOwner">${t('ownerReport')}</button>` : ''}
      <div class="mi muted small">${t('installHint')}</div><button class="mi danger-t" data-act="logout">${t('logout')}</button></div>`);
  },
  goStaff(){ closeSheet(); S.view = 'staff'; render(); },
  goOwner(){ closeSheet(); S.view = 'owner'; render(); },
  back(){ if (S.view === 'projectForm' && S.editing && S.pid) { S.editing = false; openProject(S.pid, 'info'); } else goHome(); },
  newProject(){ S.editing = false; S.pid = null; S.view = 'projectForm'; render(); },
  open(b, id){ openProject(id, 'info'); },
  tab(b, id){ S.tab = id; renderProject(); },
  async editProject(){ S.formFin = isAdmin() ? (await finance(S.pid, false)).total : 0; S.editing = true; S.view = 'projectForm'; render(); },
  delProject(){
    confirmSheet(t('confirmDelProject'), async () => {
      const ref = pref();
      for (const sub of ['photos','payments','purchases','finance']) { const q = await ref.collection(sub).get(); for (const d of q.docs) await d.ref.delete(); }
      await ref.delete(); toast(t('deleted')); goHome();
    });
  },
  async setWork(b, id){
    const [k, s] = id.split(':');
    await pref().update({['work.' + k]: Number(s), updatedAt: FV.serverTimestamp()});
    if (S.view === 'project' && S.tab === 'work') { const body = $('#tabBody'); const p = curProject(); if (body && p) body.innerHTML = workTab(p); }
  },
  viewPhoto(b, id){ const x = (S.photos||[]).find(p => p.id === id); if (x) openSheet(`<img class="full" src="${x.data}" alt=""><div class="muted small">${fmtTs(x.createdAt)}${x.by ? ' · ' + esc(x.by) : ''}</div><button class="btn" data-act="closeSheet">${t('close')}</button>`); },
  viewInv(b, id){ const x = (S.purchases||[]).find(p => p.id === id); if (x && x.image) openSheet(`<img class="full" src="${x.image}" alt=""><div><b>${esc(x.supplier)}</b> · ${money(x.amount)}</div><button class="btn" data-act="closeSheet">${t('close')}</button>`); },
  delPhoto(b, id){ confirmSheet(t('confirmDelItem'), async () => { await pref().collection('photos').doc(id).delete(); toast(t('deleted')); renderProject(); }); },
  delItem(b, id){ const [col, did] = id.split(':'); confirmSheet(t('confirmDelItem'), async () => { await pref().collection(col).doc(did).delete(); toast(t('deleted')); renderProject(); }); },
  async setRole(b, id){ const [uid, role] = id.split(':'); await db.collection('users').doc(uid).update({role}); toast(t('saved')); renderStaff(); },
  async pdf(b){
    const p = curProject(); if (!p) return; b.disabled = true;
    try { const html = await siteReportHtml(p); await makePdf(html, safeName(p.name) + ' - ' + today() + '.pdf'); }
    catch (e) { closeSheet(); fail(e); } finally { b.disabled = false; }
  },
  async ownerPdf(b){
    b.disabled = true;
    try { await makePdf(ownerReportHtml(), (lang==='ar' ? 'التقرير المالي' : 'Financial report') + ' - ' + today() + '.pdf'); }
    catch (e) { closeSheet(); fail(e); } finally { b.disabled = false; }
  },
  async sharePdf(){
    const f = S.pdfFile; if (!f) return;
    if (navigator.canShare && navigator.canShare({files:[f]})) {
      try { await navigator.share({files:[f], title:f.name}); closeSheet(); }
      catch (e) { if (e.name !== 'AbortError') downloadPdf(); }
    } else downloadPdf();
  },
  downloadPdf
};

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  e.preventDefault();
  try { await fn(b, b.dataset.id, e); } catch (err) { fail(err); }
});

const SUBMIT = {
  async authForm(f, fd){
    const email = String(fd.get('email')).trim(), pw = String(fd.get('password'));
    if (S.authMode === 'signup') {
      S.pendingName = String(fd.get('name') || '').trim();
      const c = await auth.createUserWithEmailAndPassword(email, pw);
      if (S.pendingName) await c.user.updateProfile({displayName: S.pendingName});
      if (email.toLowerCase() === OWNER_EMAIL) await c.user.sendEmailVerification();
    } else await auth.signInWithEmailAndPassword(email, pw);
  },
  async projectForm(f, fd){
    const g = k => String(fd.get(k) || '').trim();
    const data = { name:g('name'), location:g('location'), engineerName:g('engineerName'), engineerPhone:g('engineerPhone'), consultant:g('consultant'),
      windows:num(fd.get('windows')), doors:num(fd.get('doors')), notes:g('notes'), updatedAt:FV.serverTimestamp() };
    if (!data.name) { toast(t('required')); return; }
    let id = S.pid;
    if (S.editing && id) await db.collection('projects').doc(id).update(data);
    else { data.createdAt = FV.serverTimestamp(); data.work = {frame:0, silicone:0, glass:0}; data.createdBy = S.profile.name; id = (await db.collection('projects').add(data)).id; }
    if (isAdmin() && fd.has('totalValue')) await db.collection('projects').doc(id).collection('finance').doc('main').set({total:num(fd.get('totalValue'))}, {merge:true});
    S.editing = false; toast(t('saved')); openProject(id, 'info');
  },
  async payForm(f, fd){
    await pref().collection('payments').add({ amount:num(fd.get('amount')), date:String(fd.get('date')), note:String(fd.get('note')||'').trim(), by:S.profile.name, createdAt:FV.serverTimestamp() });
    toast(t('saved')); renderProject();
  },
  async purForm(f, fd){
    await pref().collection('purchases').add({ supplier:String(fd.get('supplier')).trim(), amount:num(fd.get('amount')), date:String(fd.get('date')), note:String(fd.get('note')||'').trim(),
      image:S.invoiceImg || null, by:S.profile.name, createdAt:FV.serverTimestamp() });
    S.invoiceImg = null; toast(t('saved')); renderProject();
  }
};
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, fn = SUBMIT[f.id]; if (!fn) return;
  const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try { await fn(f, new FormData(f)); } catch (err) { fail(err); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; const pl = $('#plist'); if (pl) pl.innerHTML = projectList(); } });
document.addEventListener('change', async e => {
  const inp = e.target; const kind = inp.dataset && inp.dataset.up; if (!kind) return;
  const files = [...(inp.files || [])]; if (!files.length) return;
  try {
    if (kind === 'photo') {
      toast(t('uploading'));
      for (const file of files) { const data = await compress(file, 1280, 0.6); await pref().collection('photos').add({data, by:S.profile.name, createdAt:FV.serverTimestamp()}); }
      await pref().update({updatedAt: FV.serverTimestamp()});
      toast(t('saved')); renderProject();
    } else if (kind === 'invoice') {
      S.invoiceImg = await compress(files[0], 1100, 0.6);
      const pv = $('#invPrev'); if (pv) { pv.src = S.invoiceImg; pv.hidden = false; }
    }
  } catch (err) { fail(err); }
  inp.value = '';
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
setLang(lang);
</script>
